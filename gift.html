<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift coins</title><meta name="robots" content="noindex">
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:560px;margin:0 auto;padding:20px;background:#e8eaeb;color:#17222c}
input,textarea{width:100%;font:inherit;padding:10px;margin:6px 0 14px;border:2px solid #c3c9ce;box-sizing:border-box}
button{background:#f5b700;border:0;padding:11px 18px;font-weight:700;font-size:16px;cursor:pointer}
pre{white-space:pre-wrap;word-break:break-all;background:#fff;padding:12px;border:2px dashed #c3c9ce}</style></head><body>
<h1>Send coins as a gift</h1>
<label for="a">Coins</label><input id="a" type="number" min="1" value="50">
<label for="m">Message (optional)</label><textarea id="m" rows="2" maxlength="140"></textarea>
<button id="g">Make gift code</button><pre id="o" hidden></pre><button id="c" hidden>Copy code</button>
<script>
const SECRET="change-me-before-deploy"; // must match index.html
const sig=s=>{let h=2166136261;const x=SECRET+s;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)};
document.getElementById("g").onclick=()=>{const a=parseInt(document.getElementById("a").value);if(!(a>0))return;
const o={a,i:Math.random().toString(36).slice(2,8),m:document.getElementById("m").value.trim()};
const p=btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const out=document.getElementById("o");out.hidden=false;out.textContent="TBT-"+p+"."+sig(p);document.getElementById("c").hidden=false};
document.getElementById("c").onclick=()=>navigator.clipboard.writeText(document.getElementById("o").textContent);
</script></body></html>
